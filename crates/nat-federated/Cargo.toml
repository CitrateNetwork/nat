# nat-federated — Gate-4 federated proof: signed multi-node gather → on-chain
# trace-hash commit → compute-pool settlement. The gather/verify/aggregate core is
# pure and testable here; the on-chain and settlement seams are traits whose real
# impls live against citrate-chain and citrate-compute-pool.
[package]
name = "nat-federated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The symmetric toy keyed-hash signer/verifier (`ToyKeyedSigner`/`ToyRosterVerifier`)
# is a TEST stand-in only — the verifier holds the signing key, so it is not a real
# signature scheme. It is compiled into this crate's own tests unconditionally; any
# other crate that wants it for tests must opt in with this feature (NAT2-B-013). It
# is never part of a default-features production build.
test-signer = []

[dependencies]
citrate-fed-types.workspace = true
nat-types.workspace = true
nat-train.workspace = true
sha2.workspace = true
